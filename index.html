<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TreeVenture</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__left">
        <button id="themeToggle" class="pillBtn" type="button" aria-label="Toggle dark mode">
          <span id="themeToggleIcon" aria-hidden="true">🌙</span>
          <span id="themeToggleText" class="pillBtn__text">Dark</span>
        </button>

        <button id="langToggle" class="pillBtn" type="button" aria-label="Switch language">
          <span id="langToggleIcon" aria-hidden="true">🌐</span>
          <span id="langToggleText" class="pillBtn__text">العربية</span>
        </button>
      </div>

      <div class="topbar__right">
        <div class="logo" aria-label="TreeVenture logo">
          <span class="logo__mark" aria-hidden="true">🎡</span>
          <span class="logo__text" data-i18n="brand">TreeVenture</span>
        </div>
      </div>
    </header>

    <main class="page">
      <section id="homeSection" class="homeSection" aria-label="Game home screen">
        <div class="homeCard">
          <h1 class="homeTitle">TreeVenture Game</h1>
          <p class="homeText" data-i18n="homeText">Enter number of players (2-5). Each player gives 5 turns.</p>
          <label class="homeLabel" for="playerCountInput" data-i18n="playerCountLabel">Number of players</label>
          <input id="playerCountInput" class="homeInput" type="number" min="2" max="5" value="2" />
          <button id="startRoundBtn" class="spinBtn" type="button" data-i18n="startRound">Start Round</button>
          <p id="homeFeedback" class="feedback"></p>
          <p id="roundWinner" class="winnerText"></p>
        </div>
      </section>

      <div id="gameArea" class="hidden">
        <section class="roundStatus" aria-label="Round status">
          <div class="roundInfo">
            <span id="turnInfo">Turn 0/0</span>
            <span class="roundSeparator">·</span>
            <span id="timerInfo">Timer: 30s</span>
          </div>
        </section>

        <section class="wheelSection" aria-label="Spinning wheel section">
          <div class="wheelPanel">
            <div class="wheelWrapper" id="wheelWrapper">
              <div class="wheelPointer" aria-hidden="true"></div>
              <canvas id="wheelCanvas" role="img" aria-label="Quiz wheel"></canvas>

              <div id="wheelCenterOverlay" class="wheelCenterOverlay" aria-live="polite">
                <div class="wheelCenterInner">
                  <div id="wheelSelectedIcon" class="wheelCenterIcon" aria-hidden="true">⭐</div>
                  <div id="wheelSelectedName" class="wheelCenterName"></div>
                </div>
              </div>
            </div>

            <div class="wheelActions">
              <button id="spinBtn" class="spinBtn" type="button">
                <span id="spinBtnText" data-i18n="spin">Spin</span>
              </button>
            </div>
          </div>
        </section>

        <section class="questionSection" aria-label="Questions section">
          <div class="questionCard" id="questionCard">
            <div class="questionCard__top">
              <h2 class="questionCard__title" data-i18n="questionTitle">Question</h2>
              <div id="questionMeta" class="questionMeta" aria-live="polite"></div>
            </div>

            <p id="questionText" class="questionText" aria-live="polite"></p>

            <div id="choices" class="choices" role="group" aria-label="Answer choices"></div>
            <div id="feedback" class="feedback" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="./data.js"></script>
    <script src="./script.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          displayMath: [['$$','$$'], ['\\[','\\]']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </body>
</html>
